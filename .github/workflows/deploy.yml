name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Konfiguracja klucza SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Whitelist rozszerzeń: na serwer trafiają WYŁĄCZNIE pliki będące stroną.
      # Źródła (.qmd, .md, .R, .m, .csv, .py, .ipynb, .zip, .RData ...) zostają
      # tylko w repo.
      #
      # --delete = MIRROR: pliki webowe usunięte z repo znikają też z VPS.
      # UWAGA: cokolwiek dodanego do docroot ręcznie (spoza repo) zostanie
      # skasowane przy kolejnym deployu. Excluded (niewebowe) są chronione
      # (bez --delete-excluded), więc --delete kasuje tylko nadmiarowe pliki webowe.
      - name: Deploy przez rsync (whitelist + mirror)
        run: |
          rsync -rlvz --omit-dir-times --no-perms --delete \
            --exclude '.git' --exclude '.git/**' \
            --exclude '.github' --exclude '.github/**' \
            --include '*/' \
            --include '*.html' --include '*.htm' \
            --include '*.css' --include '*.js' --include '*.mjs' --include '*.map' \
            --include '*.json' \
            --include '*.png' --include '*.jpg' --include '*.jpeg' --include '*.gif' \
            --include '*.svg' --include '*.webp' --include '*.ico' --include '*.avif' \
            --include '*.mp4' --include '*.webm' --include '*.ogg' \
            --include '*.woff' --include '*.woff2' --include '*.ttf' --include '*.otf' --include '*.eot' \
            --include '*.pdf' \
            --exclude '*' \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/main/public/"
